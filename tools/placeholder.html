<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example Tool - YBL</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .tool-page {
      max-width: 700px;
      margin: 0 auto;
      padding: 100px 24px 80px;
    }
    .tool-page h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
    }
    .tool-page .description {
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .tool-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link:hover {
      color: var(--accent-hover);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-logo">YBL</a>
    <div class="nav-links">
      <a href="/#about">About</a>
      <a href="/#tools">Tools</a>
      <a href="/#resume">Resume</a>
    </div>
  </nav>

  <div class="tool-page">
    <a href="/#tools" class="back-link">&larr; Back to Tools</a>
    <h1>Example Tool</h1>
    <p class="description">This is a placeholder tool page. Replace this with your own tool.</p>
    <div class="tool-body">
      <p>Build your tool UI here. This page shares the global stylesheet and navbar, so it feels like part of the site.</p>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Yiping Benjamin L</p>
    </div>
  </footer>
</body>
</html>
