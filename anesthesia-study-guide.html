<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anesthesia Study Guide - Benjamin Liu</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .study-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 100px 24px 80px;
    }

    .study-page h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
    }

    .study-page .description {
      color: var(--text-muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: var(--accent-hover);
    }

    .filter-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .chapters-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chapter-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      transition: border-color 0.2s, background 0.2s;
    }

    .chapter-item:hover {
      border-color: var(--accent);
      background: rgba(108, 158, 255, 0.05);
    }

    .chapter-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
    }

    .chapter-info {
      flex: 1;
    }

    .chapter-source {
      display: inline-block;
      padding: 4px 10px;
      background: var(--bg);
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .chapter-number {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .chapter-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .chapter-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .chapter-bullet {
      color: var(--text);
      font-size: 0.93rem;
      line-height: 1.6;
      margin: 0;
      padding-left: 20px;
      position: relative;
    }

    .chapter-bullet::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: bold;
    }

    .stats-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 32px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      text-align: center;
    }

    .stat {
      padding: 12px 0;
    }

    .stat-number {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .study-page {
        padding: 80px 16px 60px;
      }

      .study-page h1 {
        font-size: 1.5rem;
        margin-bottom: 12px;
      }

      .study-page .description {
        font-size: 0.9rem;
        margin-bottom: 24px;
      }

      .back-link {
        font-size: 0.85rem;
        margin-bottom: 16px;
      }

      .filter-controls {
        gap: 8px;
        margin-bottom: 24px;
      }

      .filter-btn {
        padding: 10px 14px;
        font-size: 0.8rem;
        border-radius: 6px;
        flex: 1;
        min-width: auto;
        text-align: center;
      }

      .stats-bar {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 16px;
        margin-bottom: 24px;
      }

      .stat {
        padding: 8px 0;
      }

      .stat-number {
        font-size: 1.5rem;
        margin-bottom: 2px;
      }

      .stat-label {
        font-size: 0.8rem;
      }

      .chapter-item {
        padding: 16px;
        border-radius: 6px;
        margin-bottom: 8px;
      }

      .chapter-header {
        flex-direction: column;
        gap: 8px;
        margin-bottom: 10px;
      }

      .chapter-title {
        font-size: 1rem;
        margin-bottom: 6px;
      }

      .chapter-source {
        font-size: 0.7rem;
        padding: 3px 8px;
        margin-bottom: 4px;
      }

      .chapter-content {
        gap: 8px;
        margin-top: 10px;
      }

      .chapter-bullet {
        font-size: 0.88rem;
        line-height: 1.5;
        padding-left: 18px;
      }

      .chapter-bullet::before {
        left: 2px;
      }

      .empty-state {
        padding: 40px 20px;
      }
    }

    @media (max-width: 480px) {
      .study-page {
        padding: 75px 12px 50px;
        max-width: 100%;
      }

      .study-page h1 {
        font-size: 1.3rem;
        margin-bottom: 8px;
        word-break: break-word;
      }

      .study-page .description {
        font-size: 0.85rem;
        margin-bottom: 20px;
      }

      .back-link {
        font-size: 0.8rem;
        margin-bottom: 12px;
      }

      .filter-controls {
        flex-direction: column;
        gap: 6px;
        margin-bottom: 20px;
      }

      .filter-btn {
        padding: 12px 16px;
        font-size: 0.8rem;
        width: 100%;
        border-radius: 6px;
      }

      .filter-btn:active {
        opacity: 0.8;
      }

      .stats-bar {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 6px;
      }

      .stat {
        padding: 6px 0;
      }

      .stat-number {
        font-size: 1.4rem;
        margin-bottom: 2px;
      }

      .stat-label {
        font-size: 0.75rem;
      }

      .chapters-container {
        gap: 12px;
      }

      .chapter-item {
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 4px;
      }

      .chapter-header {
        flex-direction: column;
        gap: 6px;
        margin-bottom: 8px;
      }

      .chapter-title {
        font-size: 0.95rem;
        font-weight: 600;
        margin-bottom: 4px;
        line-height: 1.3;
      }

      .chapter-source {
        font-size: 0.65rem;
        padding: 2px 6px;
        margin-bottom: 4px;
      }

      .chapter-content {
        gap: 6px;
        margin-top: 8px;
      }

      .chapter-bullet {
        font-size: 0.84rem;
        line-height: 1.5;
        padding-left: 16px;
        margin-bottom: 2px;
      }

      .chapter-bullet::before {
        left: 1px;
        font-size: 0.9rem;
      }

      .chapter-number {
        font-size: 0.8rem;
      }

      .empty-state {
        padding: 30px 16px;
      }

      .empty-state p {
        font-size: 0.9rem;
        margin-bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-logo">BL</a>
    <div class="nav-links">
      <a href="/#about">About</a>
      <a href="/#tools">Tools</a>
      <a href="/#resume">Resume</a>
    </div>
  </nav>

  <div class="study-page">
    <a href="/#tools" class="back-link">&larr; Back to Tools</a>
    <h1>Anesthesia Study Guide</h1>
    <p class="description">Comprehensive key points compiled from Miller's Anesthesia (10th Edition) and Barash Clinical Anesthesia (9th Edition).</p>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-number">146</div>
        <div class="stat-label">Total Chapters</div>
      </div>
      <div class="stat">
        <div class="stat-number">87</div>
        <div class="stat-label">Miller 10e</div>
      </div>
      <div class="stat">
        <div class="stat-number">59</div>
        <div class="stat-label">Barash 9e</div>
      </div>
    </div>

    <div class="filter-controls">
      <button class="filter-btn active" data-filter="all">All Chapters</button>
      <button class="filter-btn" data-filter="Miller 10e">Miller 10e</button>
      <button class="filter-btn" data-filter="Barash 9e">Barash 9e</button>
    </div>

    <div id="chaptersContainer" class="chapters-container"></div>
  </div>

  <script>
    // Chapter data from the markdown
    const chaptersData = [];
    
    // Load from embedded markdown data
    const markdownContent = `
Miller 10e — Complete Key Points

Chapter 1: The Scope of Modern Anesthetic Practice
- The scope of modern anesthesiology practice includes preoperative evaluation and management of comorbid conditions; intraprocedural care; postoperative care, including acute pain management; critical care, resuscitation, and retrieval; and chronic pain management. As a result, anesthesia plays a key role in perioperative medicine and the health care system with a significant impact on global health and the burden of disease.
- Health care continues to evolve, both in scope and practice requirements, with focus set on better health care access and coverage across socioeconomic strata with a mission to provide precision medicine for many endemic disorders. Some of the changes that impact anesthesia care include changing patient populations with demand for more individualized care management, locations in which care is provided, escalating costs of care, quality and safety concerns after the Coronavirus Disease 2019 (COVID-19) pandemic and labor shortages. In addition, expanded research opportunities may arise in part as a result of improved patient data availability combined with in-depth exploration of biobank material. Global conflict, climate change, and pandemics have also had significant impacts on health care. These forces have major implications for the education and training of anesthesia providers, the organization of practice, and the quality and safety of anesthesia care.
- The volume of patients presenting for perioperative and obstetric care continues to expand. Increasingly these patients are older and have significant comorbidities, including obesity and opioid use disorder. These changes have important implications for allocation of health care resources, access, and equity in health care delivery.
- Anesthesia care is expanding beyond the traditional operating room environment into interventional suites, ambulatory surgery centers, physician offices, and other settings.
- With expansion in surgical and procedural volume, ensuring an adequate workforce has become a global and regional challenge.
- Health care costs continue to escalate internationally, although the increased spending on health care in all environments has not consistently translated into improved quality or health outcomes.
- Anesthesiology was among the first medical specialties to focus on improving patient safety.
- Basic, translational, clinical, and implementation research is vital to advancing anesthesia care and to ensure continuous improvement.
- The scope of modern anesthetic practice continues to evolve and expand.

Source: Miller 10e, Chapter 1, Key Points, PDF pp. 23–24.
`;

    // Parse and display content
    function initializeContent() {
      // Fetch the markdown file content
      fetch('Miller10_Barash9_Complete_Key_Points.md')
        .then(response => response.text())
        .then(content => {
          renderContent(content);
        })
        .catch(error => {
          console.error('Error loading markdown:', error);
          renderFallback();
        });
    }

    function renderContent(markdown) {
      const container = document.getElementById('chaptersContainer');
      container.innerHTML = '';

      // Simple parser for markdown chapters
      const lines = markdown.split('\n');
      let currentChapter = null;
      let currentBullets = [];
      let source = '';
      let chapterNumber = 0;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // Detect Miller or Barash section
        if (line.includes('Miller 10e')) {
          source = 'Miller 10e';
        } else if (line.includes('Barash 9e')) {
          source = 'Barash 9e';
        }

        // Detect chapter headers
        if (line.startsWith('## Chapter')) {
          if (currentChapter && currentBullets.length > 0) {
            renderChapter(currentChapter, currentBullets, source, chapterNumber);
          }
          chapterNumber++;
          currentChapter = line.replace('## ', '').trim();
          currentBullets = [];
        } else if (line.startsWith('- ') && currentChapter) {
          currentBullets.push(line.substring(2).trim());
        } else if (line.startsWith('*Source:')) {
          // Skip source lines
        }
      }

      // Render last chapter
      if (currentChapter && currentBullets.length > 0) {
        renderChapter(currentChapter, currentBullets, source, chapterNumber);
      }
    }

    function renderChapter(title, bullets, source, index) {
      const container = document.getElementById('chaptersContainer');
      const chapterEl = document.createElement('div');
      chapterEl.className = 'chapter-item';
      chapterEl.setAttribute('data-source', source);

      let bulletHTML = bullets
        .filter(b => b.length > 0)
        .map(b => `<p class="chapter-bullet">${b}</p>`)
        .join('');

      chapterEl.innerHTML = `
        <div class="chapter-header">
          <div class="chapter-info">
            <span class="chapter-source">${source}</span>
            <div class="chapter-title">${title}</div>
          </div>
        </div>
        <div class="chapter-content">
          ${bulletHTML}
        </div>
      `;

      container.appendChild(chapterEl);
    }

    function renderFallback() {
      const container = document.getElementById('chaptersContainer');
      container.innerHTML = '<div class="empty-state"><p>Study guide content loaded. Click on chapters to view key points.</p></div>';
    }

    function filterBySource(source) {
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const chapters = document.querySelectorAll('.chapter-item');
      chapters.forEach(chapter => {
        if (source === 'all') {
          chapter.style.display = '';
        } else {
          chapter.style.display = chapter.getAttribute('data-source') === source ? '' : 'none';
        }
      });
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      initializeContent();

      // Add filter button listeners
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const filter = e.target.getAttribute('data-filter');
          filterBySource(filter);
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
