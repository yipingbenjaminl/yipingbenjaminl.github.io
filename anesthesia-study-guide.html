<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miller 10e + Barash 9e Complete Chapter Key Points</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/theme.js"></script>
  <style>
    .study-layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 100px 24px 80px;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 32px;
      align-items: start;
    }

    .study-page {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .study-page h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
    }

    .study-page .description {
      color: var(--text-muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: var(--accent-hover);
    }

    .filter-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent);
    }

    .chapters-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chapter-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      transition: border-color 0.2s, background 0.2s;
    }

    .chapter-item:hover {
      border-color: var(--accent);
      background: rgba(108, 158, 255, 0.05);
    }

    .chapter-toggle {
      display: none;
    }

    .chapter-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
    }

    .chapter-info {
      flex: 1;
    }

    .chapter-source {
      display: inline-block;
      padding: 4px 10px;
      background: var(--bg);
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .chapter-number {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .chapter-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .chapter-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .chapter-bullet {
      color: var(--text);
      font-size: 0.93rem;
      line-height: 1.6;
      margin: 0;
      padding-left: 20px;
      position: relative;
    }

    .chapter-bullet::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: bold;
    }

    .stats-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 32px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      text-align: center;
    }

    .stat {
      padding: 12px 0;
    }

    .stat-number {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .toc-panel {
      position: sticky;
      top: 96px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
    }

    .toc-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding: 0 8px;
    }

    .toc-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      padding-right: 4px;
    }

    .toc-item {
      display: block;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 9px 10px;
      background: transparent;
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .toc-item:hover,
    .toc-item:focus-visible {
      background: rgba(108, 158, 255, 0.08);
      border-color: rgba(108, 158, 255, 0.2);
      outline: none;
    }

    .toc-item.is-hidden {
      display: none;
    }

    .toc-item strong {
      display: block;
      font-size: 0.76rem;
      color: var(--accent);
      margin-bottom: 2px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .toc-item span {
      display: block;
      font-size: 0.88rem;
      line-height: 1.4;
      color: var(--text);
    }

    .toc-button,
    .toc-drawer-close {
      display: none;
    }

    .toc-overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 12, 18, 0.45);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 40;
    }

    .toc-overlay.is-open {
      opacity: 1;
      visibility: visible;
    }

    .toc-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(82vw, 340px);
      height: 100vh;
      background: var(--bg);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 50;
      display: flex;
      flex-direction: column;
      box-shadow: -12px 0 28px rgba(0, 0, 0, 0.12);
    }

    .toc-drawer.is-open {
      transform: translateX(0);
    }

    .toc-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--border);
    }

    .toc-drawer-header h3 {
      margin: 0;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .toc-drawer-close {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .toc-drawer .toc-list {
      padding: 16px 12px 24px;
      max-height: none;
      overflow-y: auto;
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
    }

    @media (max-width: 900px) {
      .navbar {
        display: none;
      }

      .back-link {
        display: none;
      }

      .study-layout {
        grid-template-columns: 1fr;
        padding-top: 0;
      }

      .toc-panel {
        display: none;
      }

      .stats-bar,
      .filter-controls {
        display: none;
      }

      .toc-button {
        position: fixed;
        right: 16px;
        bottom: 20px;
        z-index: 30;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .toc-drawer-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    }

    @media (max-width: 768px) {
      .study-page {
        padding: 18px 16px 60px;
      }

      .study-page h1 {
        font-size: 1.5rem;
        margin-bottom: 12px;
      }

      .study-page .description {
        font-size: 0.9rem;
        margin-bottom: 24px;
      }

      .back-link {
        font-size: 0.85rem;
        margin-bottom: 16px;
      }

      .filter-controls {
        gap: 8px;
        margin-bottom: 24px;
      }

      .filter-btn {
        padding: 10px 14px;
        font-size: 0.8rem;
        border-radius: 6px;
        flex: 1;
        min-width: auto;
        text-align: center;
      }

      .stats-bar {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 16px;
        margin-bottom: 24px;
      }

      .stat {
        padding: 8px 0;
      }

      .stat-number {
        font-size: 1.5rem;
        margin-bottom: 2px;
      }

      .stat-label {
        font-size: 0.8rem;
      }

      .chapter-item {
        padding: 16px;
        border-radius: 6px;
        margin-bottom: 8px;
      }

      .chapter-header {
        flex-direction: column;
        gap: 8px;
        margin-bottom: 10px;
      }

      .chapter-title {
        font-size: 1rem;
        margin-bottom: 6px;
      }

      .chapter-source {
        font-size: 0.7rem;
        padding: 3px 8px;
        margin-bottom: 4px;
      }

      .chapter-content {
        gap: 8px;
        margin-top: 10px;
      }

      .chapter-bullet {
        font-size: 0.88rem;
        line-height: 1.5;
        padding-left: 18px;
      }

      .chapter-bullet::before {
        left: 2px;
      }

      .empty-state {
        padding: 40px 20px;
      }
    }

    @media (max-width: 480px) {
      .study-page {
        padding: 8px 12px 50px;
        max-width: 100%;
      }

      .study-page h1 {
        font-size: 1.3rem;
        margin-bottom: 8px;
        word-break: break-word;
      }

      .study-page .description {
        font-size: 0.85rem;
        margin-bottom: 20px;
      }

      .back-link {
        font-size: 0.8rem;
        margin-bottom: 12px;
      }

      .filter-controls {
        flex-direction: column;
        gap: 6px;
        margin-bottom: 20px;
      }

      .filter-btn {
        padding: 12px 16px;
        font-size: 0.8rem;
        width: 100%;
        border-radius: 6px;
      }

      .filter-btn:active {
        opacity: 0.8;
      }

      .stats-bar {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 6px;
      }

      .stat {
        padding: 6px 0;
      }

      .stat:first-child {
        display: none;
      }

      .stat-number {
        font-size: 1.4rem;
        margin-bottom: 2px;
      }

      .stat-label {
        font-size: 0.75rem;
      }

      .chapters-container {
        gap: 12px;
      }

      .chapter-item {
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 4px;
      }

      .chapter-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        cursor: pointer;
        font-size: 1rem;
        line-height: 1;
        align-self: flex-start;
        margin-left: auto;
        flex-shrink: 0;
      }

      .chapter-header {
        flex-direction: row;
        gap: 8px;
        margin-bottom: 8px;
        align-items: center;
      }

      .chapter-title {
        font-size: 0.95rem;
        font-weight: 600;
        margin-bottom: 4px;
        line-height: 1.3;
      }

      .chapter-source {
        font-size: 0.65rem;
        padding: 2px 6px;
        margin-bottom: 4px;
      }

      .chapter-content {
        gap: 6px;
        margin-top: 8px;
      }

      .chapter-bullet {
        font-size: 0.84rem;
        line-height: 1.5;
        padding-left: 16px;
        margin-bottom: 2px;
      }

      .chapter-bullet::before {
        left: 1px;
        font-size: 0.9rem;
      }

      .chapter-number {
        font-size: 0.8rem;
      }

      .empty-state {
        padding: 30px 16px;
      }

      .empty-state p {
        font-size: 0.9rem;
        margin-bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-logo">BL</a>
    <div class="nav-links">
      <a href="/#about">About</a>
      <a href="/#tools">Tools</a>
      <a href="/#resume">Resume</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle light and dark theme">☀️</button>
    </div>
  </nav>

  <div class="study-layout">
    <aside class="toc-panel" aria-label="Table of contents">
      <div class="toc-title">Table of Contents</div>
      <nav id="desktopTocList" class="toc-list" aria-label="Desktop table of contents"></nav>
    </aside>

    <div class="study-page">
      <a href="/#tools" class="back-link">&larr; Back to Tools</a>
      <h1>Miller 10e + Barash 9e<br>Complete Chapter Key Points</h1>
      <p class="description">Comprehensive chapter key points compiled from Miller's Anesthesia (10th Edition) and Barash Clinical Anesthesia (9th Edition).</p>

      <div class="stats-bar">
        <div class="stat">
          <div class="stat-number">146</div>
          <div class="stat-label">Total Chapters</div>
        </div>
        <div class="stat">
          <div class="stat-number">87</div>
          <div class="stat-label">Miller 10e</div>
        </div>
        <div class="stat">
          <div class="stat-number">59</div>
          <div class="stat-label">Barash 9e</div>
        </div>
      </div>

      <div class="filter-controls">
        <button class="filter-btn active" data-filter="all">All Chapters</button>
        <button class="filter-btn" data-filter="Miller 10e">Miller 10e</button>
        <button class="filter-btn" data-filter="Barash 9e">Barash 9e</button>
      </div>

      <div id="chaptersContainer" class="chapters-container"></div>
    </div>
  </div>

  <button id="tocButton" class="toc-button" aria-label="Open table of contents">Contents</button>
  <div id="tocOverlay" class="toc-overlay" aria-hidden="true"></div>
  <aside id="tocDrawer" class="toc-drawer" aria-label="Mobile table of contents">
    <div class="toc-drawer-header">
      <h3>Contents</h3>
      <button id="tocCloseButton" class="toc-drawer-close" aria-label="Close table of contents">×</button>
    </div>
    <nav id="mobileTocList" class="toc-list" aria-label="Mobile table of contents"></nav>
  </aside>

  <script>
    const chaptersData = [];
    let activeFilter = 'all';

    const markdownContent = `
Miller 10e — Complete Key Points

Chapter 1: The Scope of Modern Anesthetic Practice
- The scope of modern anesthesiology practice includes preoperative evaluation and management of comorbid conditions; intraprocedural care; postoperative care, including acute pain management; critical care, resuscitation, and retrieval; and chronic pain management. As a result, anesthesia plays a key role in perioperative medicine and the health care system with a significant impact on global health and the burden of disease.
- Health care continues to evolve, both in scope and practice requirements, with focus set on better health care access and coverage across socioeconomic strata with a mission to provide precision medicine for many endemic disorders. Some of the changes that impact anesthesia care include changing patient populations with demand for more individualized care management, locations in which care is provided, escalating costs of care, quality and safety concerns after the Coronavirus Disease 2019 (COVID-19) pandemic and labor shortages. In addition, expanded research opportunities may arise in part as a result of improved patient data availability combined with in-depth exploration of biobank material. Global conflict, climate change, and pandemics have also had significant impacts on health care. These forces have major implications for the education and training of anesthesia providers, the organization of practice, and the quality and safety of anesthesia care.
- The volume of patients presenting for perioperative and obstetric care continues to expand. Increasingly these patients are older and have significant comorbidities, including obesity and opioid use disorder. These changes have important implications for allocation of health care resources, access, and equity in health care delivery.
- Anesthesia care is expanding beyond the traditional operating room environment into interventional suites, ambulatory surgery centers, physician offices, and other settings.
- With expansion in surgical and procedural volume, ensuring an adequate workforce has become a global and regional challenge.
- Health care costs continue to escalate internationally, although the increased spending on health care in all environments has not consistently translated into improved quality or health outcomes.
- Anesthesiology was among the first medical specialties to focus on improving patient safety.
- Basic, translational, clinical, and implementation research is vital to advancing anesthesia care and to ensure continuous improvement.
- The scope of modern anesthetic practice continues to evolve and expand.

Source: Miller 10e, Chapter 1, Key Points, PDF pp. 23–24.
`;

    function renderToC() {
      const tocLists = [
        document.getElementById('desktopTocList'),
        document.getElementById('mobileTocList')
      ];

      tocLists.forEach(list => {
        if (!list) return;
        list.innerHTML = '';
      });

      chaptersData.forEach((chapter) => {
        const item = document.createElement('a');
        item.href = `#chapter-${chapter.index}`;
        item.className = 'toc-item';
        item.dataset.source = chapter.source;
        item.innerHTML = `
          <strong>${chapter.source}</strong>
          <span>${chapter.title}</span>
        `;

        if (activeFilter !== 'all' && chapter.source !== activeFilter) {
          item.classList.add('is-hidden');
        }

        item.addEventListener('click', () => {
          if (window.innerWidth <= 900) {
            closeMobileToc();
          }
        });

        tocLists.forEach(list => {
          if (list) {
            list.appendChild(item.cloneNode(true));
          }
        });
      });
    }

    function initializeContent() {
      fetch('data/miller-barash-key-points.md')
        .then(response => response.text())
        .then(content => {
          renderContent(content);
        })
        .catch(error => {
          console.error('Error loading markdown:', error);
          renderFallback();
        });
    }

    function renderContent(markdown) {
      const container = document.getElementById('chaptersContainer');
      container.innerHTML = '';
      chaptersData.length = 0;

      const lines = markdown.split('\n');
      let currentChapter = null;
      let currentBullets = [];
      let source = '';
      let chapterNumber = 0;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.includes('Miller 10e')) {
          source = 'Miller 10e';
        } else if (line.includes('Barash 9e')) {
          source = 'Barash 9e';
        }

        if (line.startsWith('## Chapter')) {
          if (currentChapter && currentBullets.length > 0) {
            renderChapter(currentChapter, currentBullets, source, chapterNumber);
          }
          chapterNumber++;
          currentChapter = line.replace('## ', '').trim();
          currentBullets = [];
        } else if (line.startsWith('- ') && currentChapter) {
          currentBullets.push(line.substring(2).trim());
        }
      }

      if (currentChapter && currentBullets.length > 0) {
        renderChapter(currentChapter, currentBullets, source, chapterNumber);
      }

      renderToC();
    }

    function renderChapter(title, bullets, source, index) {
      const container = document.getElementById('chaptersContainer');
      const chapterEl = document.createElement('div');
      chapterEl.className = 'chapter-item';
      chapterEl.id = `chapter-${index}`;
      chapterEl.setAttribute('data-source', source);
      chapterEl.setAttribute('data-title', title);

      const bulletHTML = bullets
        .filter(b => b.length > 0)
        .map(b => `<p class="chapter-bullet">${b}</p>`)
        .join('');

      chapterEl.innerHTML = `
        <div class="chapter-header">
          <div class="chapter-info">
            <span class="chapter-source">${source}</span>
            <div class="chapter-title">${title}</div>
          </div>
          <button class="chapter-toggle" type="button" aria-expanded="true" aria-label="Collapse chapter">−</button>
        </div>
        <div class="chapter-content">
          ${bulletHTML}
        </div>
      `;

      const toggleButton = chapterEl.querySelector('.chapter-toggle');
      const content = chapterEl.querySelector('.chapter-content');

      if (toggleButton && content) {
        toggleButton.addEventListener('click', () => {
          const isExpanded = toggleButton.getAttribute('aria-expanded') === 'true';
          toggleButton.setAttribute('aria-expanded', String(!isExpanded));
          toggleButton.textContent = isExpanded ? '+' : '−';
          content.style.display = isExpanded ? 'none' : 'flex';
        });
      }

      container.appendChild(chapterEl);
      chaptersData.push({ index, title, source });
    }

    function renderFallback() {
      const container = document.getElementById('chaptersContainer');
      container.innerHTML = '<div class="empty-state"><p>Study guide content loaded. Click on chapters to view key points.</p></div>';
    }

    function filterBySource(source) {
      activeFilter = source;

      const chapters = document.querySelectorAll('.chapter-item');
      chapters.forEach(chapter => {
        const shouldShow = source === 'all' || chapter.getAttribute('data-source') === source;
        chapter.style.display = shouldShow ? '' : 'none';
      });

      document.querySelectorAll('.toc-item').forEach(item => {
        const shouldShow = source === 'all' || item.dataset.source === source;
        item.classList.toggle('is-hidden', !shouldShow);
      });
    }

    function openMobileToc() {
      const drawer = document.getElementById('tocDrawer');
      const overlay = document.getElementById('tocOverlay');
      if (!drawer || !overlay) return;
      drawer.classList.add('is-open');
      overlay.classList.add('is-open');
    }

    function closeMobileToc() {
      const drawer = document.getElementById('tocDrawer');
      const overlay = document.getElementById('tocOverlay');
      if (!drawer || !overlay) return;
      drawer.classList.remove('is-open');
      overlay.classList.remove('is-open');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initializeContent();

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const filter = e.target.getAttribute('data-filter');
          filterBySource(filter);
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
        });
      });

      const tocButton = document.getElementById('tocButton');
      const tocCloseButton = document.getElementById('tocCloseButton');
      const tocOverlay = document.getElementById('tocOverlay');

      if (tocButton) {
        tocButton.addEventListener('click', openMobileToc);
      }

      if (tocCloseButton) {
        tocCloseButton.addEventListener('click', closeMobileToc);
      }

      if (tocOverlay) {
        tocOverlay.addEventListener('click', closeMobileToc);
      }

      let touchStartX = 0;
      let touchStartY = 0;

      document.addEventListener('touchstart', (event) => {
        const touch = event.changedTouches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }, { passive: true });

      document.addEventListener('touchend', (event) => {
        if (window.innerWidth > 900) return;

        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;

        if (Math.abs(deltaY) > 60 || Math.abs(deltaX) < 70) return;

        if (deltaX > 0) {
          openMobileToc();
        }

        if (deltaX < 0 && document.getElementById('tocDrawer').classList.contains('is-open')) {
          closeMobileToc();
        }
      }, { passive: true });
    });
  </script>
</body>
</html>
