<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anesthesiology Exam Simulator</title>
  <script src="assets/js/theme.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --bg-alt: #111827;
      --surface: #111827;
      --surface-strong: #1f2937;
      --panel: rgba(17, 24, 39, 0.9);
      --input-bg: rgba(15, 23, 42, 0.9);
      --on-primary: #082f49;
      --border: rgba(148, 163, 184, 0.28);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #7dd3fc;
      --primary-strong: #38bdf8;
      --success: #34d399;
      --success-soft: rgba(52, 211, 153, 0.12);
      --success-text: #d1fae5;
      --error: #f87171;
      --error-soft: rgba(248, 113, 113, 0.12);
      --error-text: #fecaca;
      --warning: #fbbf24;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.35);
    }

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --bg-alt: #eef2f7;
      --surface: #ffffff;
      --surface-strong: #eef2f7;
      --panel: rgba(255, 255, 255, 0.92);
      --input-bg: #ffffff;
      --on-primary: #ffffff;
      --border: rgba(15, 23, 42, 0.14);
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --primary-strong: #0369a1;
      --success: #059669;
      --success-soft: rgba(5, 150, 105, 0.12);
      --success-text: #065f46;
      --error: #dc2626;
      --error-soft: rgba(220, 38, 38, 0.12);
      --error-text: #991b1b;
      --warning: #b45309;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.12), transparent 30%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .back-link {
      font-size: 0.95rem;
      color: var(--primary);
      opacity: 0.95;
    }

    .page-header {
      margin-bottom: 18px;
    }

    .page-header h1 {
      margin: 8px 0 10px;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .page-header p {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      font-size: 1rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      flex-wrap: wrap;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat {
      min-width: 120px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(148, 163, 184, 0.06);
      border: 1px solid var(--border);
    }

    .stat strong {
      display: block;
      font-size: 1.35rem;
      line-height: 1.2;
      color: var(--primary);
    }

    .stat span {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      font: inherit;
    }

    .action-btn,
    .question-chip,
    .option-btn {
      cursor: pointer;
      border: 1px solid var(--border);
      transition: 0.15s ease;
    }

    .action-btn {
      border-radius: 10px;
      background: rgba(148, 163, 184, 0.06);
      color: var(--text);
      padding: 10px 16px;
      font-weight: 600;
    }

    .action-btn:hover,
    .question-chip:hover,
    .option-btn:hover {
      border-color: rgba(125, 211, 252, 0.65);
      transform: translateY(-1px);
    }

    .action-btn.primary {
      background: var(--primary);
      color: var(--on-primary);
      border-color: transparent;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .sidebar {
      position: sticky;
      top: 18px;
      padding: 18px 16px 16px;
      transition: width 0.2s ease, padding 0.2s ease;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sidebar h2 {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }

    .nav-toggle {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(148, 163, 184, 0.05);
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(148, 163, 184, 0.05);
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s ease;
    }

    .theme-toggle:hover {
      border-color: rgba(125, 211, 252, 0.65);
    }

    .sidebar.collapsed {
      width: 92px;
      padding: 14px 10px 12px;
    }

    .sidebar.collapsed .sidebar-header h2 {
      display: none;
    }

    .sidebar.collapsed .question-grid {
      display: none;
    }

    .question-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      max-height: 720px;
      overflow: auto;
      padding-right: 4px;
    }

    .question-chip {
      background: rgba(148, 163, 184, 0.04);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 6px;
      min-height: 34px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .question-chip.current {
      background: rgba(125, 211, 252, 0.18);
      border-color: rgba(125, 211, 252, 0.8);
      color: var(--primary);
    }

    .question-chip.answered-correct {
      background: rgba(52, 211, 153, 0.12);
      border-color: rgba(52, 211, 153, 0.7);
      color: var(--success-text);
    }

    .question-chip.answered-wrong {
      background: rgba(248, 113, 113, 0.12);
      border-color: rgba(248, 113, 113, 0.7);
      color: var(--error-text);
    }

    .question-card {
      padding: 22px 22px 18px;
    }

    .question-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      flex-wrap: wrap;
    }

    .question-meta .id {
      color: var(--primary);
      font-weight: 700;
    }

    .question-meta .meta-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .question-meta .domain {
      color: var(--muted);
      font-weight: 500;
    }

    .question-meta .difficulty {
      color: var(--primary);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(125, 211, 252, 0.08);
    }

    .question-text {
      margin: 0 0 22px;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      line-height: 1.5;
      letter-spacing: -0.02em;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: rgba(148, 163, 184, 0.03);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .option-btn .letter {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(148, 163, 184, 0.09);
      border: 1px solid var(--border);
      font-weight: 700;
      color: var(--primary);
      flex-shrink: 0;
    }

    .option-btn.selected {
      border-color: rgba(125, 211, 252, 0.8);
      background: rgba(125, 211, 252, 0.08);
    }

    .option-btn.correct {
      border-color: rgba(52, 211, 153, 0.8);
      background: var(--success-soft);
    }

    .option-btn.incorrect {
      border-color: rgba(248, 113, 113, 0.75);
      background: var(--error-soft);
    }

    .option-label {
      font-weight: 600;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .answer-panel {
      margin-top: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      display: none;
    }

    .answer-panel.visible {
      display: block;
    }

    .answer-panel.success {
      background: var(--success-soft);
      border-color: rgba(52, 211, 153, 0.75);
    }

    .answer-panel.error {
      background: var(--error-soft);
      border-color: rgba(248, 113, 113, 0.75);
    }

    .answer-panel h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .answer-panel p {
      margin: 0 0 10px;
      color: var(--text);
    }

    .answer-panel .rationale {
      color: var(--text);
      line-height: 1.7;
    }

    .answer-panel .sources {
      margin: 10px 0 0;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .answer-panel .sources strong {
      color: var(--text);
    }

    .option-explanations {
      margin-top: 22px;
      display: grid;
      gap: 12px;
    }

    .explanation-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(148, 163, 184, 0.03);
    }

    .explanation-item.correct {
      border-color: rgba(52, 211, 153, 0.7);
      background: rgba(52, 211, 153, 0.08);
    }

    .explanation-item.incorrect {
      border-color: rgba(248, 113, 113, 0.7);
      background: rgba(248, 113, 113, 0.08);
    }

    .explanation-item strong {
      display: inline-block;
      margin-right: 6px;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .explanation-item span {
      color: var(--muted);
      line-height: 1.6;
    }

    .explanation-item .reasoning {
      display: block;
      margin-top: 6px;
      color: var(--text);
      font-style: italic;
      opacity: 0.85;
    }

    .hidden {
      display: none !important;
    }

    .filter-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      margin-left: 8px;
      border-radius: 999px;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .filter-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 6, 23, 0.72);
    }

    .filter-panel {
      width: 100%;
      max-width: 520px;
      max-height: 84vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .filter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }

    .filter-header h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .filter-body {
      padding: 18px 20px;
      overflow-y: auto;
      display: grid;
      gap: 22px;
    }

    .filter-group h3 {
      margin: 0 0 10px;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-pill {
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      background: rgba(148, 163, 184, 0.05);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .filter-pill.active {
      border-color: rgba(125, 211, 252, 0.85);
      background: rgba(125, 211, 252, 0.16);
      color: var(--primary);
    }

    .filter-search {
      width: 100%;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      margin-bottom: 10px;
    }

    .domain-list {
      max-height: 300px;
      overflow-y: auto;
      display: grid;
      gap: 4px;
    }

    .domain-group-label {
      margin: 10px 0 2px;
      padding: 0 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .domain-group-label:first-child {
      margin-top: 0;
    }

    .domain-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .domain-option:hover {
      background: rgba(148, 163, 184, 0.06);
    }

    .domain-option input {
      accent-color: var(--primary-strong);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .domain-empty {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 8px 4px;
    }

    .filter-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .filter-match-count {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .filter-footer-actions {
      display: flex;
      gap: 10px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .question-grid {
        max-height: none;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding-left: 14px;
        padding-right: 14px;
      }

      .toolbar {
        padding: 14px;
      }

      .stats {
        width: 100%;
      }

      .stat {
        flex: 1 1 calc(33.333% - 8px);
        min-width: 90px;
      }

      .actions {
        width: 100%;
      }

      .action-btn {
        flex: 1 1 calc(50% - 5px);
      }

      .layout {
        display: block;
      }

      .sidebar {
        display: none !important;
      }

      .question-card {
        padding: 18px 14px;
      }

      .option-btn {
        grid-template-columns: 30px minmax(0, 1fr);
        padding: 12px 12px;
      }

      .option-btn .letter {
        width: 30px;
        height: 30px;
      }

      .filter-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .filter-panel {
        max-width: none;
        width: 100%;
        max-height: 88vh;
        border-radius: 20px 20px 0 0;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <a href="/" class="back-link">← Back to home</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle light and dark theme">☀️</button>
    </div>

    <header class="page-header">
      <h1>Anesthesiology Exam Simulator</h1>
      <p>Work through this exam set and review the rationale for every answer choice.</p>
    </header>

    <section class="toolbar card" aria-label="Exam progress controls">
      <div class="stats">
        <div class="stat">
          <strong id="answeredCount">0</strong>
          <span>Answered</span>
        </div>
        <div class="stat">
          <strong id="correctCount">0</strong>
          <span>Correct</span>
        </div>
        <div class="stat">
          <strong id="questionTotal">0</strong>
          <span>Questions</span>
        </div>
      </div>

      <div class="actions">
        <button id="filterButton" class="action-btn" type="button">
          Filters<span id="filterBadge" class="filter-badge hidden">0</span>
        </button>
        <button id="prevButton" class="action-btn" type="button">Previous</button>
        <button id="nextButton" class="action-btn primary" type="button">Next</button>
        <button id="resetButton" class="action-btn" type="button">Reset</button>
      </div>
    </section>

    <div class="layout">
      <aside class="sidebar card" aria-label="Question navigator">
        <div class="sidebar-header">
          <h2>Questions</h2>
          <button id="navToggle" class="nav-toggle" type="button" aria-label="Toggle question navigator">»</button>
        </div>
        <div id="questionGrid" class="question-grid"></div>
      </aside>

      <section class="question-card card" aria-live="polite">
        <div id="questionMeta" class="question-meta"></div>
        <h2 id="questionText" class="question-text"></h2>
        <div id="options" class="options" aria-label="Answer choices"></div>
        <div id="answerPanel" class="answer-panel"></div>
        <div id="optionExplanations" class="option-explanations"></div>
      </section>
    </div>
  </main>

  <div id="filterOverlay" class="filter-overlay hidden">
    <div class="filter-panel card" role="dialog" aria-modal="true" aria-label="Filter questions">
      <div class="filter-header">
        <h2>Filter questions</h2>
        <button id="filterCloseButton" class="nav-toggle" type="button" aria-label="Close filters">✕</button>
      </div>

      <div class="filter-body">
        <div class="filter-group">
          <h3>Difficulty</h3>
          <div id="difficultyPills" class="pill-group"></div>
        </div>

        <div class="filter-group">
          <h3>Domain</h3>
          <input id="domainSearch" type="text" class="filter-search" placeholder="Search domains…" autocomplete="off">
          <div id="domainList" class="domain-list"></div>
        </div>
      </div>

      <div class="filter-footer">
        <span id="filterMatchCount" class="filter-match-count"></span>
        <div class="filter-footer-actions">
          <button id="filterClearButton" class="action-btn" type="button">Clear all</button>
          <button id="filterDoneButton" class="action-btn primary" type="button">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DIFFICULTY_ORDER = ['Foundational', 'Intermediate', 'Advanced'];

    const state = {
      questions: [],
      availableDomains: [],
      availableDifficulties: [],
      currentQuestionId: null,
      selected: {},
      selectedExamFile: 'data/exams/exam-set-1.json',
      filters: {
        difficulties: new Set(),
        domains: new Set()
      },
      domainSearch: ''
    };

    const questionGrid = document.getElementById('questionGrid');
    const questionMeta = document.getElementById('questionMeta');
    const questionText = document.getElementById('questionText');
    const optionsWrap = document.getElementById('options');
    const answerPanel = document.getElementById('answerPanel');
    const optionExplanations = document.getElementById('optionExplanations');
    const answeredCountEl = document.getElementById('answeredCount');
    const correctCountEl = document.getElementById('correctCount');
    const questionTotalEl = document.getElementById('questionTotal');

    const filterButton = document.getElementById('filterButton');
    const filterBadge = document.getElementById('filterBadge');
    const filterOverlay = document.getElementById('filterOverlay');
    const filterCloseButton = document.getElementById('filterCloseButton');
    const filterDoneButton = document.getElementById('filterDoneButton');
    const filterClearButton = document.getElementById('filterClearButton');
    const difficultyPillsWrap = document.getElementById('difficultyPills');
    const domainSearchInput = document.getElementById('domainSearch');
    const domainListWrap = document.getElementById('domainList');
    const filterMatchCount = document.getElementById('filterMatchCount');

    function normalizeQuestions(examData) {
      const questions = (examData && examData.questions) || [];
      return questions.map((question) => ({
        ...question,
        correct: (question.correct || 'A').toUpperCase(),
        optionExplanationMap: question.optionExplanations || {}
      }));
    }

    function getFilteredQuestions() {
      return state.questions.filter((question) => {
        if (state.filters.difficulties.size && !state.filters.difficulties.has(question.difficulty)) {
          return false;
        }
        if (state.filters.domains.size && !state.filters.domains.has(question.domain)) {
          return false;
        }
        return true;
      });
    }

    function getCurrentView() {
      const filtered = getFilteredQuestions();
      let index = filtered.findIndex((question) => question.id === state.currentQuestionId);
      if (index === -1) index = 0;
      return { filtered, index, question: filtered[index] };
    }

    function renderQuestionNavigator(filtered, currentId) {
      questionGrid.innerHTML = '';

      if (!filtered.length) {
        questionGrid.innerHTML = '<p class="domain-empty">No questions match your filters.</p>';
        return;
      }

      filtered.forEach((question) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'question-chip';
        if (question.id === currentId) button.classList.add('current');

        const selected = state.selected[question.id];
        if (selected) {
          button.classList.add(selected === question.correct ? 'answered-correct' : 'answered-wrong');
        }

        button.textContent = question.number;
        button.setAttribute('aria-label', `Question ${question.number}`);
        button.addEventListener('click', () => {
          state.currentQuestionId = question.id;
          render();
        });
        questionGrid.appendChild(button);
      });
    }

    function setSidebarCollapsed(isCollapsed) {
      const sidebar = document.querySelector('.sidebar');
      const toggle = document.getElementById('navToggle');
      if (!sidebar || !toggle) return;
      sidebar.classList.toggle('collapsed', isCollapsed);
      toggle.textContent = isCollapsed ? '«' : '»';
      toggle.setAttribute('aria-label', isCollapsed ? 'Expand question navigator' : 'Collapse question navigator');
      const layout = document.querySelector('.layout');
      if (layout) {
        layout.style.gridTemplateColumns = isCollapsed ? '92px minmax(0, 1fr)' : '260px minmax(0, 1fr)';
      }
    }

    function renderQuestion(question) {
      if (!question) {
        questionMeta.innerHTML = '';
        questionText.textContent = 'No questions match your filters.';
        optionsWrap.innerHTML = '<p style="color: var(--muted);">Adjust or clear filters to see more questions.</p>';
        answerPanel.className = 'answer-panel';
        answerPanel.innerHTML = '';
        optionExplanations.innerHTML = '';
        optionExplanations.classList.add('hidden');
        return;
      }

      const selected = state.selected[question.id];

      questionMeta.innerHTML = `
        <span class="meta-left">
          <span class="id">Question ${question.number}</span>
          ${question.domain ? `<span class="domain">${question.domain}</span>` : ''}
          ${question.difficulty ? `<span class="difficulty">${question.difficulty}</span>` : ''}
        </span>
        <span>${question.id}</span>
      `;

      questionText.textContent = question.prompt;
      optionsWrap.innerHTML = '';

      Object.entries(question.options).forEach(([letter, text]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option-btn';

        if (selected === letter) {
          button.classList.add('selected');
        }
        if (selected) {
          if (letter === question.correct) {
            button.classList.add('correct');
          }
          if (letter === selected && selected !== question.correct) {
            button.classList.add('incorrect');
          }
        }

        button.innerHTML = `
          <span class="letter">${letter}</span>
          <span class="option-label">${text}</span>
        `;

        button.addEventListener('click', () => {
          state.selected[question.id] = letter;
          render();
        });

        optionsWrap.appendChild(button);
      });

      const hasSelected = typeof selected !== 'undefined';
      const answerPanelClass = selected === question.correct ? 'success' : 'error';
      answerPanel.className = `answer-panel ${hasSelected ? 'visible' : ''} ${hasSelected ? answerPanelClass : ''}`;

      if (hasSelected) {
        const correctText = selected === question.correct ? 'Correct.' : `Incorrect. The correct answer is ${question.correct}.`;
        const sources = question.sources || [];
        const sourcesHtml = sources.length
          ? `<p class="sources"><strong>Textbook references:</strong> ${sources.join(' · ')}</p>`
          : '';
        answerPanel.innerHTML = `
          <h3>${selected === question.correct ? 'Correct' : 'Incorrect'}</h3>
          <p>${correctText}</p>
          <p class="rationale"><strong>Rationale:</strong> ${question.rationale || question.answerText || 'No rationale was parsed for this question.'}</p>
          ${sourcesHtml}
        `;
      } else {
        answerPanel.innerHTML = '';
      }

      optionExplanations.innerHTML = '';
      if (hasSelected) {
        Object.keys(question.options).forEach((letter) => {
          const explanation = question.optionExplanationMap[letter] || 'No explanation provided.';
          const item = document.createElement('div');
          item.className = 'explanation-item';
          if (letter === question.correct) item.classList.add('correct');
          if (letter === selected && letter !== question.correct) item.classList.add('incorrect');

          const reasoning = letter === question.correct
            ? question.bestAnswerReasoning
            : (question.whyNotBest || {})[letter];
          const reasoningHtml = reasoning ? `<span class="reasoning">${reasoning}</span>` : '';

          item.innerHTML = `
            <strong>${letter}:</strong>
            <span>${explanation}</span>
            ${reasoningHtml}
          `;
          optionExplanations.appendChild(item);
        });
      } else {
        optionExplanations.classList.add('hidden');
      }

      if (hasSelected) {
        optionExplanations.classList.remove('hidden');
      } else {
        optionExplanations.classList.add('hidden');
      }
    }

    function updateStats(filtered) {
      const answered = filtered.filter((question) => typeof state.selected[question.id] !== 'undefined').length;
      const correct = filtered.filter((question) => state.selected[question.id] === question.correct).length;

      answeredCountEl.textContent = String(answered);
      correctCountEl.textContent = String(correct);
      questionTotalEl.textContent = String(filtered.length);
    }

    function render() {
      const { filtered, question } = getCurrentView();
      state.currentQuestionId = question ? question.id : null;
      renderQuestionNavigator(filtered, state.currentQuestionId);
      renderQuestion(question);
      updateStats(filtered);
    }

    // --- Filters ---------------------------------------------------------

    function parseDomain(domain) {
      const match = domain.match(/^Domain (\d+) · (.+)$/);
      return match ? { number: Number(match[1]), label: match[2] } : { number: 0, label: domain };
    }

    function updateFilterBadge() {
      const count = state.filters.difficulties.size + state.filters.domains.size;
      filterBadge.textContent = String(count);
      filterBadge.classList.toggle('hidden', count === 0);
    }

    function updateFilterMatchCount() {
      const filtered = getFilteredQuestions();
      filterMatchCount.textContent = `${filtered.length} of ${state.questions.length} questions match`;
    }

    function renderDifficultyPills() {
      const ordered = DIFFICULTY_ORDER.filter((level) => state.availableDifficulties.includes(level))
        .concat(state.availableDifficulties.filter((level) => !DIFFICULTY_ORDER.includes(level)));

      difficultyPillsWrap.innerHTML = '';
      ordered.forEach((level) => {
        const pill = document.createElement('button');
        pill.type = 'button';
        pill.className = 'filter-pill';
        if (state.filters.difficulties.has(level)) pill.classList.add('active');
        pill.textContent = level;
        pill.addEventListener('click', () => {
          if (state.filters.difficulties.has(level)) {
            state.filters.difficulties.delete(level);
          } else {
            state.filters.difficulties.add(level);
          }
          onFiltersChanged();
        });
        difficultyPillsWrap.appendChild(pill);
      });
    }

    function renderDomainList() {
      const previousScroll = domainListWrap.scrollTop;
      const term = state.domainSearch.trim().toLowerCase();
      const groups = new Map();

      state.availableDomains.forEach((domain) => {
        if (term && !domain.toLowerCase().includes(term)) return;
        const { number, label } = parseDomain(domain);
        if (!groups.has(number)) groups.set(number, []);
        groups.get(number).push({ domain, label });
      });

      domainListWrap.innerHTML = '';
      const sortedNumbers = [...groups.keys()].sort((a, b) => a - b);

      if (!sortedNumbers.length) {
        domainListWrap.innerHTML = '<p class="domain-empty">No domains match your search.</p>';
        return;
      }

      sortedNumbers.forEach((number) => {
        const groupLabel = document.createElement('div');
        groupLabel.className = 'domain-group-label';
        groupLabel.textContent = `Domain ${number}`;
        domainListWrap.appendChild(groupLabel);

        groups.get(number).forEach(({ domain, label }) => {
          const row = document.createElement('label');
          row.className = 'domain-option';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = state.filters.domains.has(domain);
          checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
              state.filters.domains.add(domain);
            } else {
              state.filters.domains.delete(domain);
            }
            onFiltersChanged();
          });

          const span = document.createElement('span');
          span.textContent = label;

          row.appendChild(checkbox);
          row.appendChild(span);
          domainListWrap.appendChild(row);
        });
      });

      domainListWrap.scrollTop = previousScroll;
    }

    function onFiltersChanged() {
      renderDifficultyPills();
      renderDomainList();
      updateFilterBadge();
      updateFilterMatchCount();
      render();
    }

    function openFilterOverlay() {
      renderDifficultyPills();
      renderDomainList();
      updateFilterMatchCount();
      filterOverlay.classList.remove('hidden');
    }

    function closeFilterOverlay() {
      filterOverlay.classList.add('hidden');
    }

    filterButton.addEventListener('click', openFilterOverlay);
    filterCloseButton.addEventListener('click', closeFilterOverlay);
    filterDoneButton.addEventListener('click', closeFilterOverlay);
    filterOverlay.addEventListener('click', (event) => {
      if (event.target === filterOverlay) closeFilterOverlay();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !filterOverlay.classList.contains('hidden')) {
        closeFilterOverlay();
      }
    });

    domainSearchInput.addEventListener('input', (event) => {
      state.domainSearch = event.target.value;
      renderDomainList();
    });

    filterClearButton.addEventListener('click', () => {
      state.filters.difficulties.clear();
      state.filters.domains.clear();
      onFiltersChanged();
    });

    // --- Loading / navigation ---------------------------------------------

    function loadExam(fileName = state.selectedExamFile) {
      state.selectedExamFile = fileName;

      fetch(fileName)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Failed to load exam data (${response.status})`);
          }
          return response.json();
        })
        .then((examData) => {
          state.questions = normalizeQuestions(examData);
          if (!state.questions.length) {
            throw new Error('No questions found in the exam data file.');
          }

          state.availableDomains = [...new Set(state.questions.map((q) => q.domain).filter(Boolean))]
            .sort((a, b) => {
              const pa = parseDomain(a);
              const pb = parseDomain(b);
              return pa.number - pb.number || pa.label.localeCompare(pb.label);
            });
          state.availableDifficulties = [...new Set(state.questions.map((q) => q.difficulty).filter(Boolean))];

          state.currentQuestionId = state.questions[0].id;
          state.selected = {};
          state.filters.difficulties.clear();
          state.filters.domains.clear();
          state.domainSearch = '';
          domainSearchInput.value = '';

          updateFilterBadge();
          render();
        })
        .catch((error) => {
          console.error(error);
          questionText.textContent = 'The exam file could not be loaded.';
          optionsWrap.innerHTML = '<p style="color: var(--error);">Please serve this site from a local web server or GitHub Pages so the browser can read the exam data.</p>';
          answerPanel.className = 'answer-panel visible error';
          answerPanel.innerHTML = '<h3>Load error</h3><p>Check that the exam JSON file is present in the same folder and served over HTTP.</p>';
          optionExplanations.innerHTML = '';
          questionTotalEl.textContent = '0';
        });
    }

    document.getElementById('prevButton').addEventListener('click', () => {
      const { filtered, index } = getCurrentView();
      if (index > 0) {
        state.currentQuestionId = filtered[index - 1].id;
        render();
      }
    });

    document.getElementById('nextButton').addEventListener('click', () => {
      const { filtered, index } = getCurrentView();
      if (index < filtered.length - 1) {
        state.currentQuestionId = filtered[index + 1].id;
        render();
      }
    });

    document.getElementById('resetButton').addEventListener('click', () => {
      state.selected = {};
      render();
    });

    document.getElementById('navToggle').addEventListener('click', () => {
      const sidebar = document.querySelector('.sidebar');
      if (!sidebar) return;
      const nextCollapsed = !sidebar.classList.contains('collapsed');
      setSidebarCollapsed(nextCollapsed);
    });

    const params = new URLSearchParams(window.location.search);
    const requestedSet = params.get('set');
    const defaultSet = requestedSet && ['data/exams/exam-set-1.json', 'data/exams/exam-set-2.json'].includes(requestedSet)
      ? requestedSet
      : state.selectedExamFile;

    setSidebarCollapsed(true);
    loadExam(defaultSet);
  </script>
</body>
</html>
